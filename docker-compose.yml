version: '3.8'

services:
  mysql_db:
    image: mysql:8.0
    container_name: mysql_parcial
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: parcial_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: